name: Deploy Web to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-web.yml"
      - "apps/web/**"
      - "apps/server/.env.schema"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "turbo.json"
      - "biome.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      API_UPSTREAM_URL: ${{ vars.API_UPSTREAM_URL }}
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          for (const key of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "NEXT_PUBLIC_SERVER_URL", "API_UPSTREAM_URL"]) {
            if (!process.env[key]?.trim()) {
              throw new Error(`Missing GitHub Actions secret or variable: ${key}`);
            }
          }

          const url = new URL(process.env.NEXT_PUBLIC_SERVER_URL);
          const isLocal = url.hostname === "localhost" || url.hostname.endsWith(".localhost") ||
            url.hostname.startsWith("127.") || url.hostname === "0.0.0.0" || url.hostname === "[::1]";
          if (url.protocol !== "https:" || isLocal || url.username || url.password || url.search || url.hash) {
            throw new Error("NEXT_PUBLIC_SERVER_URL must be a production HTTPS API base URL without credentials, query or fragment.");
          }
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Generation requires a URL for config validation, but never connects to a database.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm run db:generate

      - name: Check Web and shared packages
        run: pnpm exec ultracite check apps/web packages

      - name: Run Web and API unit tests
        run: pnpm exec turbo run test --filter=web --filter=@zyk-dyna-admin/api

      - name: Build Cloudflare Worker
        env:
          NODE_ENV: production
        run: pnpm --dir apps/web run build:cloudflare

      - name: Check Web and dependency types
        run: pnpm exec turbo run check-types --filter=web

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/web run deploy:cloudflare
