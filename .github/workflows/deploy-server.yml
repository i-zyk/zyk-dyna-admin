name: Build and deploy Server
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/server/**", "packages/api/**", "packages/auth/**", "packages/db/**", "scripts/aws/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/deploy-server.yml"]
  push:
    branches: [main]
    paths: ["apps/server/**", "packages/api/**", "packages/auth/**", "packages/db/**", "scripts/aws/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/deploy-server.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-server-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: us-east-2
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      API_UPSTREAM_URL: ${{ vars.API_UPSTREAM_URL }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: "24", package-manager-cache: false}
      - uses: pnpm/action-setup@v6
        with: {cache: true}
      - run: pnpm install --frozen-lockfile
      - name: Build and verify Lambda package
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          pnpm run build:lambda
          pnpm --dir apps/server run test:lambda
          node --test scripts/aws/*.test.mjs
          pnpm exec turbo run check-types --filter=server
          pnpm exec turbo run test --filter=@zyk-dyna-admin/api --filter=@zyk-dyna-admin/db
      - uses: actions/upload-artifact@v7
        with:
          name: server-lambda
          path: apps/server/dist/server-lambda.zip
          if-no-files-found: error
          retention-days: 7
      - name: Explain pending AWS identity configuration
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: echo 'AWS deployment is skipped because AWS_DEPLOY_ROLE_ARN is not configured. This account previously denied GitHub OIDC creation. The verified Lambda ZIP is available in artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@v6
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Migrate and deploy AWS application
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
        env:
          AWS_DEPLOYMENT_MODE: ${{ vars.AWS_DEPLOYMENT_MODE || 'free' }}
        run: |
          if [ "$AWS_DEPLOYMENT_MODE" = "vpc" ]; then
            node scripts/aws/deploy.mjs
          else
            node scripts/aws/deploy-free.mjs
          fi
